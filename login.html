<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal Login | Keshavkrupa Hospital</title>

    <!-- Meta Tags for SEO -->
    <meta name="description"
        content="Access the Keshavkrupa Hospital Patient Portal. Securely log in to view medical history, test reports, consult online, and schedule visits.">
    <meta name="keywords" content="patient login, keshavkrupa portal, view medical reports, online doctors">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/all.min.css">

    <!-- Core Style Sheet -->
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        /* Fullscreen Layout Specifics for Premium Portal */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at 10% 20%, rgba(0, 122, 122, 0.15) 0%, rgba(10, 95, 95, 0.05) 90.1%);
            font-family: 'Outfit', sans-serif;
        }

        .portal-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Left Panel - Visual Branding Brand Card */
        .portal-brand-panel {
            flex: 1.2;
            position: relative;
            background: #002B2B;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 50px;
            color: var(--bg-white);
            overflow: hidden;
        }

        .portal-brand-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 43, 43, 0.85) 0%, rgba(0, 43, 43, 0.3) 50%, rgba(0, 43, 43, 0.85) 100%),
                url('https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            opacity: 1;
            z-index: 1;
            pointer-events: none;
        }

        .portal-brand-panel::after {
            content: '';
            position: absolute;
            bottom: -150px;
            right: -150px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(229, 182, 62, 0.15) 0%, rgba(229, 182, 62, 0) 70%);
            pointer-events: none;
        }

        .brand-panel-header {
            z-index: 2;
        }

        .brand-panel-header .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .brand-panel-header .logo-svg {
            width: 45px;
            height: 45px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .brand-panel-header .logo-text {
            display: flex;
            flex-direction: column;
        }

        .brand-panel-header .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--bg-white);
        }

        .brand-panel-header .brand-tagline {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .brand-panel-body {
            z-index: 2;
            max-width: 500px;
            margin: auto 0;
        }

        .brand-panel-body h1 {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--bg-white);
        }

        .brand-panel-body h1 span {
            color: var(--accent);
            display: block;
        }

        .brand-panel-body p {
            font-size: 1.1rem;
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .brand-features-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .brand-features-list li {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1rem;
            font-weight: 500;
        }

        .brand-features-list li i {
            color: var(--accent);
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }

        .brand-panel-footer {
            z-index: 2;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* Right Panel - Login Form Container */
        .portal-form-panel {
            flex: 1;
            background: var(--bg-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 10%;
            position: relative;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.03);
        }

        .back-to-home-link {
            position: absolute;
            top: 40px;
            left: 10%;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition-quick);
        }

        .back-to-home-link:hover {
            color: var(--primary);
            transform: translateX(-4px);
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-header p a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .form-header p a:hover {
            text-decoration: underline;
        }

        /* Form Elements overrides to fit design system */
        .portal-login-form .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .portal-login-form .form-control {
            width: 100%;
            padding: 16px 20px;
            border: 1.5px solid #E2E8F0;
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition-quick);
            background-color: #F8FAFC;
            color: var(--text-dark);
        }

        .portal-login-form .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--bg-white);
            box-shadow: 0 0 0 4px rgba(0, 122, 122, 0.1);
        }

        .portal-login-form .floating-label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: var(--transition-quick);
            background-color: transparent;
            padding: 0 4px;
            font-size: 1rem;
        }

        .portal-login-form .form-control:focus~.floating-label,
        .portal-login-form .form-control:not(:placeholder-shown)~.floating-label {
            top: 0;
            font-size: 0.8rem;
            color: var(--primary);
            background-color: var(--bg-white);
            font-weight: 600;
        }

        .password-toggle-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 5;
        }

        .password-toggle-btn:hover {
            color: var(--primary);
        }

        .form-options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container input {
            cursor: pointer;
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        .forgot-password-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: var(--bg-white);
            border: none;
            border-radius: var(--border-radius-md);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-quick);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 10px 20px rgba(0, 122, 122, 0.15);
            transform: translateY(-2px);
        }

        .social-divider {
            position: relative;
            text-align: center;
            margin: 30px 0;
        }

        .social-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #E2E8F0;
            z-index: 1;
        }

        .social-divider span {
            position: relative;
            background: var(--bg-white);
            padding: 0 15px;
            color: var(--text-muted);
            font-size: 0.85rem;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .social-login-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .social-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border: 1.5px solid #E2E8F0;
            border-radius: var(--border-radius-md);
            background: var(--bg-white);
            color: var(--text-dark);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-quick);
        }

        .social-login-btn:hover {
            background: #F8FAFC;
            border-color: #CBD5E1;
        }

        /* Responsive Breakpoints */
        @media (max-width: 992px) {
            .portal-brand-panel {
                display: none;
                /* Hide brand panel on tablets and mobile */
            }

            .portal-form-panel {
                padding: 60px 8%;
            }

            .back-to-home-link {
                left: 8%;
            }
        }
    </style>
</head>

<body>

    <!-- CUSTOM CURSOR -->
    <div class="custom-cursor"></div>
    <div class="custom-cursor-follower"></div>

    <!-- PRELOADER -->
    <div id="loader">
        <div class="loader-content">
            <div class="loader-logo-wrapper">
                <img src="assets/images/logo-icon.svg" alt="Keshavkrupa Logo" class="loader-logo-img heartbeat-pulse">
            </div>
            <div class="loader-ekg-wrapper">
                <svg viewBox="0 0 200 40" class="ekg-svg">
                    <path class="ekg-line-bg"
                        d="M 0 20 L 50 20 L 60 5 L 70 35 L 85 5 L 100 20 L 150 20 L 160 10 L 170 30 L 180 20 L 200 20"
                        fill="none" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                    <path class="ekg-line"
                        d="M 0 20 L 50 20 L 60 5 L 70 35 L 85 5 L 100 20 L 150 20 L 160 10 L 170 30 L 180 20 L 200 20"
                        fill="none" stroke="#007A7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <h2 class="loader-text">Keshavkrupa</h2>
            <p class="loader-subtext">Care You Can Trust</p>
        </div>
    </div>

    <div class="portal-wrapper">
        <!-- Left Panel -->
        <div class="portal-brand-panel">
            <!-- Image only -->
        </div>

        <!-- Right Panel -->
        <div class="portal-form-panel">
            <a href="index.html" class="back-to-home-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Homepage
            </a>

            <!-- Logo centered here on the right side -->
            <div class="portal-logo-right" style="margin: 0 auto 30px auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 10; width: fit-content; text-align: center;">
                <img src="assets/images/logo-icon.svg" alt="Keshavkrupa Hospital Logo" style="width: 52px; height: 52px; filter: drop-shadow(0 4px 8px rgba(0,122,122,0.12));">
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <span style="font-size: 1.6rem; font-weight: 700; color: var(--primary-dark); font-family: 'Outfit', sans-serif; line-height: 1.2; letter-spacing: 0.5px;">Keshavkrupa</span>
                    <span style="font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 2.5px; margin-top: 3px;">Care You Can Trust</span>
                </div>
            </div>

            <div class="form-header" style="text-align: center;">
                <h2>Welcome Back</h2>
                <p>Don't have an account or portal credentials? <a href="contact.html">Contact admin</a></p>
            </div>

            <form id="portalLoginForm" class="portal-login-form" autocomplete="on">
                <!-- Email/ID Field -->
                <div class="form-group">
                    <input type="text" id="email" name="email" required placeholder=" " class="form-control"
                        autocomplete="username">
                    <label for="email" class="floating-label">User ID, Email, or Employee ID</label>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <input type="password" id="password" name="password" required placeholder=" " class="form-control"
                        autocomplete="current-password">
                    <label for="password" class="floating-label">Password</label>
                    <button type="button" class="password-toggle-btn" aria-label="Toggle Password Visibility">
                        <i class="fa-regular fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Options Row -->
                <div class="form-options-row">
                    <label class="checkbox-container">
                        <input type="checkbox" name="rememberMe" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">
                    <span>Secure Login</span>
                    <i class="fa-solid fa-shield-halved"></i>
                </button>

                <div class="social-divider">
                    <span>Or login with partner ID</span>
                </div>

                <div class="social-login-grid">
                    <button type="button" class="social-login-btn">
                        <img src="https://www.google.com/favicon.ico" alt="Google Logo" width="16" height="16">
                        <span>Google Health</span>
                    </button>
                    <button type="button" class="social-login-btn">
                        <i class="fa-brands fa-github" style="font-size: 1.1rem;"></i>
                        <span>Github Key</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core Application scripts (Cursor, preloader and animations) -->
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/ScrollTrigger.min.js"></script>
    <script src="assets/js/script.js"></script>

    <script>
        // Scoped JS for portal login forms
        document.addEventListener("DOMContentLoaded", () => {
            const passInput = document.getElementById("password");
            const toggleBtn = document.querySelector(".password-toggle-btn");

            if (toggleBtn && passInput) {
                toggleBtn.addEventListener("click", () => {
                    const type = passInput.getAttribute("type") === "password" ? "text" : "password";
                    passInput.setAttribute("type", type);

                    const icon = toggleBtn.querySelector("i");
                    if (type === "text") {
                        icon.className = "fa-regular fa-eye";
                    } else {
                        icon.className = "fa-regular fa-eye-slash";
                    }
                });
            }
        });
    </script>
</body>

</html>
