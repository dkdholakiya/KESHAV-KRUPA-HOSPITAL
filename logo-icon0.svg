<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 30 240 240" width="100%" height="100%">
    <!-- Drop Shadow Definition -->
    <defs>
        <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#007A7A" flood-opacity="0.12" />
        </filter>
    </defs>

    <g filter="url(#icon-shadow)">
        <!-- 1. The Main Medical Cross Outline (Deep Teal) -->
        <path d="M 160,70 A 40,40 0 0,1 240,70 L 240,110 L 280,110 A 40,40 0 0,1 280,190 L 240,190 L 240,230 A 40,40 0 0,1 160,230 L 160,190 L 120,190 A 40,40 0 0,1 120,110 L 160,110 Z" 
              fill="none" 
              stroke="#007A7A" 
              stroke-width="18" 
              stroke-linejoin="round" 
              stroke-linecap="round" />

        <!-- 2. Stethoscope Tubing (Deep Teal) -->
        <!-- Stethoscope Headset (Earpiece) inside Left Arm -->
        <path d="M 132,130 C 132,146 158,146 158,130" 
              fill="none" 
              stroke="#007A7A" 
              stroke-width="6" 
              stroke-linecap="round" />
        <!-- Eartips -->
        <circle cx="132" cy="130" r="5" fill="#007A7A" />
        <circle cx="158" cy="130" r="5" fill="#007A7A" />

        <!-- Stethoscope Tubing Body looping through center to the right loop -->
        <path d="M 145,142 C 145,168 180,172 195,152 C 210,132 218,126 235,145" 
              fill="none" 
              stroke="#007A7A" 
              stroke-width="6" 
              stroke-linecap="round" 
              stroke-linejoin="round" />

        <!-- Circular Loop on the Right Arm -->
        <path d="M 235,145 A 24,24 0 1,1 270,165" 
              fill="none" 
              stroke="#007A7A" 
              stroke-width="6" 
              stroke-linecap="round" />

        <!-- 3. Accent Gold Heart inside Right Loop -->
        <path d="M 252,143 C 252,139 248,135 243,135 C 238,135 234,139 234,144 C 234,152 252,162 252,162 C 252,162 270,152 270,144 C 270,139 266,135 261,135 C 256,135 252,139 252,143 Z" 
              fill="#E5B63E" />
              
        <!-- Heartbeat Line (ECG) inside the Gold Heart (White) -->
        <path d="M 241,148 L 245,148 L 247,141 L 250,154 L 253,145 L 255,150 L 258,148 L 263,148" 
              fill="none" 
              stroke="#FFFFFF" 
              stroke-width="2" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
    </g>
</svg>
